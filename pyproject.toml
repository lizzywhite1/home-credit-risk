[project]
name = "home-credit-risk"
version = "0.1.0"
description = "Credit default risk prediction pipeline"
authors = [{name = "Lizzy White", email = "lizzywhite018@icloud.com"}]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
hcr = "home_credit_risk.cli:app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
